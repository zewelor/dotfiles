onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
window_title = "Herdr: {workspace}"
# window_title = "{workspace} | {terminal_title}"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
]

[ui.sound.agents]
codex = "off"

[theme]
name = "catppuccin-latte"
auto_switch = false

[keys]
prefix = "ctrl+a"
last_pane = "prefix+a"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle diff review"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "open projects"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "open quick actions"

[ui.toast]
delivery = "herdr"
